<div x-data="settingsModule()" x-init="initSettings()" class="space-y-6 max-w-2xl mx-auto">
    <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-800 text-lg border-b pb-3">إعدادات الأكاديمية</h3>
        
        <form @submit.prevent="saveSettings" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اسم الأكاديمية الرسمي</label>
                <input type="text" x-model="settings.academyName" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">العملة المستخدمة</label>
                <input type="text" x-model="settings.currency" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
            <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-brand-600/20">
                حفظ الإعدادات
            </button>
        </form>
    </div>
</div>
