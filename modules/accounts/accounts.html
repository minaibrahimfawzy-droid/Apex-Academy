<div x-data="accountsModule()" x-init="initAccounts()" class="space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
        <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">تحصيل الأقساط والرسوم</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div class="md:col-span-2">
                <label class="block text-xs font-bold text-slate-700 mb-1.5">كود الطالب أو اسم الطالب</label>
                <input type="text" x-model="paymentForm.student" placeholder="ادخل الكود..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-rose-600">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">المبلغ (ج)</label>
                <input type="number" x-model="paymentForm.amount" placeholder="0" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono focus:outline-none focus:border-rose-600">
            </div>
        </div>
        <div class="pt-2">
            <button @click="collectPayment()" class="px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-sm transition-all shadow-md shadow-rose-600/20 flex items-center space-x-reverse space-x-2">
                <i class="fa-solid fa-cash-register"></i>
                <span>تحصيل السداد</span>
            </button>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
        <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">سجل العمليات المالية الأخيرة</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-right text-sm">
                <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                    <tr>
                        <th class="py-3 px-4">التاريخ والوقت</th>
                        <th class="py-3 px-4">الكود</th>
                        <th class="py-3 px-4">اسم الطالب</th>
                        <th class="py-3 px-4">المبلغ</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <template x-for="item in payments" :key="item.id">
                        <tr class="hover:bg-slate-50/80 transition-all">
                            <td class="py-3 px-4 font-mono text-xs text-slate-500" x-text="item.date"></td>
                            <td class="py-3 px-4 font-mono text-indigo-600" x-text="item.code"></td>
                            <td class="py-3 px-4 font-bold text-slate-800" x-text="item.name"></td>
                            <td class="py-3 px-4 font-mono font-bold text-emerald-600" x-text="item.amount + ' ج.م'"></td>
                        </tr>
                    </template>
                    <template x-if="payments.length === 0">
                       <tr><td colspan="4" class="py-12 text-center text-slate-400">لا توجد مدفوعات مسجلة حديثاً.</td></tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>
