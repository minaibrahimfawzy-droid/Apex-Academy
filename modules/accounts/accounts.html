<div x-data="accountsModule()" x-init="initAccounts()" class="space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-800 text-base border-b pb-3">تحصيل الرسوم والأقساط</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اختر الطالب أو الكود</label>
                <select x-model="selectedCode" @change="fetchStudentData" class="w-full px-4 py-2.5 rounded-xl border text-sm bg-white focus:outline-none focus:border-indigo-600">
                    <option value="">اختر الطالب...</option>
                    <template x-for="s in students">
                        <option :value="s.code" x-text="s.name + ' (' + s.code + ')'"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">المبلغ المراد تحصيله (ج.م)</label>
                <input type="number" x-model="amount" placeholder="مثال: 150" class="w-full px-4 py-2.5 rounded-xl border text-sm font-mono focus:outline-none focus:border-indigo-600">
            </div>
            <div class="flex items-end">
                <button @click="pay" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition-all shadow-md">تحصيل وحفظ السداد</button>
            </div>
        </div>
        <div x-show="currentStudent" class="p-4 bg-slate-50 rounded-xl text-xs space-y-1 font-mono border border-slate-200">
            <p>إجمالي المطلوب: <span class="font-bold text-slate-800" x-text="currentStudent?.requiredAmount + ' ج.م'"></span></p>
            <p>إجمالي المدفوع سابقاً: <span class="font-bold text-emerald-600" x-text="totalPaid + ' ج.م'"></span></p>
            <p>المتبقي: <span class="font-bold text-rose-600" x-text="(currentStudent?.requiredAmount - totalPaid) + ' ج.م'"></span></p>
        </div>
    </div>
    <script>
        function accountsModule() {
            return {
                students: [],
                selectedCode: '',
                amount: '',
                currentStudent: null,
                totalPaid: 0,
                initAccounts() {
                    this.students = Alpine.store('apex').students;
                },
                fetchStudentData() {
                    this.currentStudent = this.students.find(s => s.code === this.selectedCode);
                    if (this.currentStudent) {
                        let payments = Alpine.store('apex').payments.filter(p => p.code === this.selectedCode);
                        this.totalPaid = payments.reduce((sum, p) => sum + Number(p.amount), 0);
                    } else {
                        this.totalPaid = 0;
                    }
                },
                pay() {
                    if (!this.selectedCode || !this.amount) return;
                    Alpine.store('apex').savePayment({ code: this.selectedCode, name: this.currentStudent.name, amount: this.amount });
                    alert('تم تسجيل الدفع بنجاح!');
                    this.amount = '';
                    this.fetchStudentData();
                }
            }
        }
    </script>
</div>
