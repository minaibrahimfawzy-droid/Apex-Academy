<div class="space-y-6 max-w-2xl mx-auto">
    <div x-data="settingsModule()" x-init="initSettings()" class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-800 text-lg border-b pb-3">إعدادات الأكاديمية[cite: 14]</h3>
        <form @submit.prevent="saveSettings" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اسم الأكاديمية الرسمي[cite: 14]</label>
                <input type="text" x-model="settings.academyName" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">العملة المستخدمة[cite: 14]</label>
                <input type="text" x-model="settings.currency" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/20">
                حفظ الإعدادات[cite: 14]
            </button>
        </form>
    </div>

    <div x-data="backupModule()" class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-6">
        <h3 class="font-bold text-slate-800 text-lg border-b pb-3">النسخ الاحتياطي واستعادة البيانات[cite: 14]</h3>
        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-200">
            <div>
                <h4 class="font-bold text-slate-800 text-sm">تصدير نسخة احتياطية كاملة[cite: 14]</h4>
                <p class="text-xs text-slate-500">تنزيل ملف JSON يضم كامل البيانات[cite: 14].</p>
            </div>
            <button @click="exportData()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition-all">تنزيل النسخة[cite: 14]</button>
        </div>
        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-200">
            <div>
                <h4 class="font-bold text-slate-800 text-sm">استعادة بيانات من ملف[cite: 14]</h4>
                <p class="text-xs text-slate-500">رفع ملف JSON سابق لتعويض البيانات[cite: 14].</p>
            </div>
            <label class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs cursor-pointer transition-all">
                اختيار ملف[cite: 14]
                <input type="file" @change="importData($event)" accept=".json" class="hidden">
            </label>
        </div>
    </div>
</div>
