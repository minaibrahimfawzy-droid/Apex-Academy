<div x-data="hallsModule()" x-init="initHalls()" class="space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- جدول القائمة (يسار) -->
        <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
            <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">قاعة القاعات المسجلة</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                        <tr>
                            <th class="py-3 px-4">اسم أو رقم القاعة</th>
                            <th class="py-3 px-4">السعة الاستيعابية</th>
                            <th class="py-3 px-4 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <template x-for="item in halls" :key="item.id">
                            <tr class="hover:bg-slate-50/80 transition-all">
                                <td class="py-3 px-4 font-bold text-slate-800" x-text="item.name"></td>
                                <td class="py-3 px-4 font-mono text-indigo-600 font-semibold" x-text="item.capacity + ' طالب'"></td>
                                <td class="py-3 px-4 text-center">
                                    <button @click="deleteHall(item.id)" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="حذف"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </template>
                        <template x-if="halls.length === 0">
                            <tr><td colspan="3" class="py-12 text-center text-slate-400">لا توجد قاعات مضافة حالياً.</td></tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- نموذج الإضافة (يمين) -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-5 h-fit">
            <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">إضافة قاعة جديدة</h3>
            <form @submit.prevent="saveHall" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم أو رقم القاعة <span class="text-rose-500">*</span></label>
                    <input type="text" x-model="formData.name" placeholder="مثال: قاعة الأديسون (101)" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">السعة الاستيعابية للطلاب</label>
                    <input type="number" x-model="formData.capacity" placeholder="مثال: 25" min="1" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono focus:outline-none focus:border-indigo-600">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-md shadow-indigo-600/20">
                    حفظ القاعة
                </button>
            </form>
        </div>
    </div>
</div>
