<div x-data="hallsModule()" x-init="initHalls()" class="space-y-6 max-w-xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-800 text-base border-b pb-3">إدارة القاعات الدراسية</h3>
        <form @submit.prevent="save" class="flex space-x-reverse space-x-2">
            <input type="text" x-model="hallName" placeholder="اسم القاعة الجديدة..." required class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-600">
            <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-sm shadow-md">إضافة</button>
        </form>
        <div class="space-y-2">
            <template x-for="h in halls" :key="h.id">
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <span class="font-bold text-slate-800 text-sm" x-text="h.name"></span>
                    <button @click="del(h.id)" class="text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg text-xs transition-all"><i class="fa-solid fa-trash"></i></button>
                </div>
            </template>
        </div>
    </div>
    <script>
        function hallsModule() {
            return {
                halls: [],
                hallName: '',
                initHalls() { this.halls = Alpine.store('apex').halls; },
                save() {
                    Alpine.store('apex').saveHall({ name: this.hallName });
                    this.halls = Alpine.store('apex').halls;
                    this.hallName = '';
                },
                del(id) {
                    Alpine.store('apex').deleteHall(id);
                    this.halls = Alpine.store('apex').halls;
                }
            }
        }
    </script>
</div>
