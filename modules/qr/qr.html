<div x-data="qrModule()" x-init="initQR()" class="space-y-6 max-w-xl mx-auto text-center">

    <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-800 text-lg">مسح كود الطالب للتسجيل السريع</h3>
        <p class="text-xs text-slate-500">قم بوجيه كاميرا الجهاز نحو رمز الـ QR الخاص بكارت الطالب لتسجيل الحضور فوراً.</p>
        
        <div id="reader" class="overflow-hidden rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50"></div>

        <div x-show="lastScannedStudent" x-cloak class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 text-right space-y-1">
            <p class="text-xs font-bold text-emerald-800">تم تسجيل الحضور بنجاح!</p>
            <p class="text-sm font-extrabold text-emerald-900" x-text="lastScannedStudent.name"></p>
            <p class="text-xs font-mono text-emerald-700" x-text="'كود: ' + lastScannedStudent.code"></p>
        </div>
    </div>

</div>
