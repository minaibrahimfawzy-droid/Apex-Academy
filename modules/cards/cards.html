<div x-data="cardsModule()" x-init="initCards()" class="space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-800 text-base border-b pb-3">بطاقات تعريف الطلاب (الكارنيهات)</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <template x-for="s in students" :key="s.id">
                <div class="border-2 border-indigo-600/20 rounded-2xl p-5 bg-gradient-to-br from-white to-indigo-50/30 shadow-sm space-y-3 relative overflow-hidden">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md" x-text="s.year"></span>
                            <h4 class="font-bold text-slate-800 text-base mt-1" x-text="s.name"></h4>
                        </div>
                        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md">Apex</div>
                    </div>
                    <div class="text-xs text-slate-600 space-y-1 font-mono pt-2 border-t border-slate-100">
                        <p>المجموعة: <span class="font-bold text-slate-800" x-text="s.group"></span></p>
                        <p>الكود: <span class="font-bold text-indigo-600" x-text="s.code"></span></p>
                    </div>
                </div>
            </template>
            <template x-if="students.length === 0">
                <div class="col-span-3 py-12 text-center text-slate-400">لا توجد بطاقات متاحة، قم بتسجيل طلاب أولاً.</div>
            </template>
        </div>
    </div>
    <script>
        function cardsModule() {
            return {
                students: [],
                initCards() { this.students = Alpine.store('apex').students; }
            }
        }
    </script>
</div>
