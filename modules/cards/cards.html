<div x-data="cardsModule()" x-init="initCards()" class="space-y-6">

    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4 no-print">
        <div class="w-full md:w-96">
            <label class="block text-xs font-bold text-slate-700 mb-1">اختر الطالب لإنشاء الكارت:</label>
            <select x-model="selectedStudentId" @change="generateCard()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                <option value="">حدد الطالب...</option>
                <template x-for="st in students" :key="st.id">
                    <option :value="st.id" x-text="st.name + ' (' + st.code + ')'"></option>
                </template>
            </select>
        </div>

        <button @click="printCard()" :disabled="!selectedStudent" class="px-6 py-2.5 bg-slate-900 hover:bg-slate-800 disabled:opacity-50 text-white font-bold rounded-xl text-sm transition-all flex items-center space-x-reverse space-x-2">
            <i class="fa-solid fa-print"></i>
            <span>طباعة الكارت</span>
        </button>
    </div>

    <!-- بطاقة الطالب المطبوعة -->
    <div class="flex justify-center py-8">
        <template x-if="selectedStudent">
            <div id="printable-card" class="student-card print-area p-6 flex flex-col justify-between shadow-2xl">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 class="font-extrabold text-lg text-white">Apex Academy</h2>
                        <p class="text-[10px] text-indigo-200">بطاقة هوية طالب</p>
                    </div>
                    <div class="w-8 h-8 rounded-lg bg-white/20 backdrop-blur-md flex items-center justify-center font-black">
                        A
                    </div>
                </div>

                <div class="space-y-1 my-2">
                    <h3 class="font-bold text-base text-white" x-text="selectedStudent.name"></h3>
                    <p class="text-xs text-indigo-100" x-text="selectedStudent.grade"></p>
                    <p class="text-xs font-mono text-indigo-200">كود: <span x-text="selectedStudent.code"></span></p>
                </div>

                <div class="flex justify-between items-end">
                    <div class="text-[9px] text-indigo-200">صادرة من نظام الأكاديمية الرسمي</div>
                    <div id="qrcode-container" class="bg-white p-1 rounded-md"></div>
                </div>
            </div>
        </template>
        <template x-if="!selectedStudent">
            <div class="text-slate-400 text-sm py-12 text-center">يرجى اختيار طالب من القائمة ليتم عرض ودعم طباعة الكارت.</div>
        </template>
    </div>

</div>
