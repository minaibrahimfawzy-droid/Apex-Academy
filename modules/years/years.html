<div x-data="yearsModule()" x-init="initYears()" class="space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- جدول القائمة (يسار) -->
        <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
            <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">قائمة السنوات الدراسية المسجلة</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                        <tr>
                            <th class="py-3 px-4">اسم السنة الدراسية</th>
                            <th class="py-3 px-4">ملاحظات</th>
                            <th class="py-3 px-4 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <template x-for="item in years" :key="item.id">
                            <tr class="hover:bg-slate-50/80 transition-all">
                                <td class="py-3 px-4 font-bold text-slate-800" x-text="item.name"></td>
                                <td class="py-3 px-4 text-slate-600" x-text="item.notes || '-'"></td>
                                <td class="py-3 px-4 text-center">
                                    <button @click="deleteYear(item.id)" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="حذف"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </template>
                        <template x-if="years.length === 0">
                            <tr><td colspan="3" class="py-12 text-center text-slate-400">لا توجد سنوات دراسية مضافة حتى الآن.</td></tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- نموذج الإضافة (يمين) -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-5 h-fit">
            <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">إضافة سنة / مرحلة دراسية</h3>
            <form @submit.prevent="saveYear" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم السنة الدراسية <span class="text-rose-500">*</span></label>
                    <input type="text" x-model="formData.name" placeholder="مثال: الأول الثانوي" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">ملاحظات وصفية</label>
                    <input type="text" x-model="formData.notes" placeholder="اختياري..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-600">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-md shadow-indigo-600/20">
                    حفظ السنة الدراسية
                </button>
            </form>
        </div>
    </div>
</div>
