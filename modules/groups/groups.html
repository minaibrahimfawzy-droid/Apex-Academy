<div x-data="groupsModule()" x-init="initGroups()" class="space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- جدول القائمة (يسار) -->
        <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-4">
            <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">قائمة المجموعات المسجلة</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                        <tr>
                            <th class="py-3 px-4">اسم المجموعة</th>
                            <th class="py-3 px-4">السنة الدراسية</th>
                            <th class="py-3 px-4">القاعة</th>
                            <th class="py-3 px-4">المواعيد</th>
                            <th class="py-3 px-4">الاشتراك</th>
                            <th class="py-3 px-4 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <template x-for="item in groups" :key="item.id">
                            <tr class="hover:bg-slate-50/80 transition-all">
                                <td class="py-3 px-4 font-bold text-slate-800" x-text="item.name"></td>
                                <td class="py-3 px-4 text-slate-600" x-text="item.year"></td>
                                <td class="py-3 px-4 text-slate-600" x-text="item.hall"></td>
                                <td class="py-3 px-4 font-mono text-xs text-indigo-600" x-text="item.schedule"></td>
                                <td class="py-3 px-4 font-mono font-bold text-slate-700" x-text="item.price + ' ج.م'"></td>
                                <td class="py-3 px-4 text-center">
                                    <button @click="deleteGroup(item.id)" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="حذف"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </template>
                        <template x-if="groups.length === 0">
                            <tr><td colspan="6" class="py-12 text-center text-slate-400">لا توجد مجموعات مسجلة بعد.</td></tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- نموذج الإضافة (يمين) -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-5 h-fit">
            <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">إضافة مجموعة دراسية</h3>
            <form @submit.prevent="saveGroup" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم المجموعة <span class="text-rose-500">*</span></label>
                    <input type="text" x-model="formData.name" placeholder="مثال: مجموعة أ - السبت" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">السنة الدراسية <span class="text-rose-500">*</span></label>
                    <select x-model="formData.year" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:border-indigo-600">
                        <option value="">اختر السنة الدراسية...</option>
                        <template x-for="y in availableYears">
                            <option :value="y.name" x-text="y.name"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">القاعة الدراسية</label>
                    <select x-model="formData.hall" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:border-indigo-600">
                        <option value="">اختر القاعة...</option>
                        <template x-for="h in availableHalls">
                            <option :value="h.name" x-text="h.name"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">المواعيد</label>
                    <input type="text" x-model="formData.schedule" placeholder="مثال: سبت وتلات 4 عصراً" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">سعر الاشتراك (جنيه) <span class="text-rose-500">*</span></label>
                    <input type="number" x-model="formData.price" placeholder="مثال: 150" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono focus:outline-none focus:border-indigo-600">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-md shadow-indigo-600/20">
                    حفظ المجموعة
                </button>
            </form>
        </div>
    </div>
</div>
