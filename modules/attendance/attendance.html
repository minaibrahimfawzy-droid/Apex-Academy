<div x-data="attendanceModule()" class="space-y-6 max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-6">
        <h3 class="font-bold text-slate-800 text-center text-base border-b border-slate-100 pb-3">تسجيل الحضور بالباركود</h3>
        
        <div class="flex space-x-reverse space-x-2">
            <input type="text" x-model="studentCode" @keyup.enter="recordAttendance()" placeholder="أدخل كود الطالب يدوياً..." class="flex-1 px-4 py-3 rounded-xl border border-slate-200 text-sm font-mono focus:outline-none focus:border-emerald-600">
            <button @click="recordAttendance()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition-all shadow-md">تسجيل</button>
        </div>

        <div class="border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center space-y-4">
            <div class="w-16 h-16 bg-slate-50 text-slate-400 rounded-2xl mx-auto flex items-center justify-center text-2xl">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <button @click="alert('جاري تشغيل الكاميرا...')" class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center space-x-reverse space-x-2 mx-auto">
                <i class="fa-solid fa-camera"></i>
                <span>تشغيل الكاميرا للمسح</span>
            </button>
        </div>
    </div>
</div>
