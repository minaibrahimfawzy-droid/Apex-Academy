<div x-data="registerStudentModule()" x-init="initData()" class="space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-6 max-w-4xl mx-auto">
        <h3 class="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">تسجيل طالب جديد</h3>
        <form @submit.prevent="saveStudent" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم الطالب رباعي <span class="text-rose-500">*</span></label>
                    <input type="text" x-model="formData.name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">السنة الدراسية <span class="text-rose-500">*</span></label>
                    <select x-model="formData.year" @change="filterGroups()" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:border-indigo-600">
                        <option value="">اختر السنة...</option>
                        <template x-for="y in years">
                            <option :value="y.name" x-text="y.name"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">هاتف الطالب</label>
                    <input type="text" x-model="formData.phone" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">المجموعة الدراسية <span class="text-rose-500">*</span></label>
                    <select x-model="formData.group" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:border-indigo-600">
                        <option value="">اختر المجموعة...</option>
                        <template x-for="g in filteredGroups">
                            <option :value="g.name" x-text="g.name"></option>
                        </template>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">هاتف ولي الأمر</label>
                    <input type="text" x-model="formData.parentPhone" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono focus:outline-none focus:border-indigo-600">
                </div>
            </div>
            <div class="pt-2">
                <button type="submit" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-md shadow-indigo-600/20 flex items-center space-x-reverse space-x-2">
                    <i class="fa-solid fa-lock"></i>
                    <span>حفظ وتسجيل الطالب</span>
                </button>
            </div>
        </form>
    </div>
</div>
