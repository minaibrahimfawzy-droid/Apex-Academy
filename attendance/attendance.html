<div x-data="attendanceModule()" x-init="initAttendance()" class="space-y-6">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="flex items-center space-x-reverse space-x-3 w-full md:w-auto">
            <label class="text-xs font-bold text-slate-700">تاريخ اليوم:</label>
            <input type="date" x-model="selectedDate" @change="loadAttendance()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-mono focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="w-full md:w-80 relative">
            <input type="text" x-model="searchQuery" placeholder="بحث باسم الطالب أو الكود..." class="w-full pr-10 pl-4 py-2 rounded-xl border border-slate-200 text-sm bg-slate-50">
            <i class="fa-solid fa-search absolute right-3.5 top-3 text-slate-400 text-xs"></i>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-right text-sm">
                <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                    <tr>
                        <th class="py-4 px-4">الكود</th>
                        <th class="py-4 px-4">اسم الطالب</th>
                        <th class="py-4 px-4">الصف الدراسي</th>
                        <th class="py-4 px-4 text-center">حالة الحضور</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <template x-for="student in filteredStudents" :key="student.id">
                        <tr class="hover:bg-slate-50/80 transition-all">
                            <td class="py-3 px-4 font-mono font-bold text-indigo-600" x-text="student.code"></td>
                            <td class="py-3 px-4 font-bold text-slate-800" x-text="student.name"></td>
                            <td class="py-3 px-4 text-slate-600" x-text="student.grade"></td>
                            <td class="py-3 px-4 text-center">
                                <div class="flex items-center justify-center space-x-reverse space-x-2">
                                    <button @click="markStatus(student.id, 'present')" :class="getStatus(student.id) === 'present' ? 'bg-emerald-600 text-white font-bold shadow-md shadow-emerald-600/30' : 'bg-slate-100 text-slate-600 hover:bg-emerald-100 hover:text-emerald-700'" class="px-4 py-1.5 rounded-xl text-xs transition-all">حاضر <i class="fa-solid fa-check mr-1"></i></button>
                                    <button @click="markStatus(student.id, 'absent')" :class="getStatus(student.id) === 'absent' ? 'bg-rose-600 text-white font-bold shadow-md shadow-rose-600/30' : 'bg-slate-100 text-slate-600 hover:bg-rose-100 hover:text-rose-700'" class="px-4 py-1.5 rounded-xl text-xs transition-all">غائب <i class="fa-solid fa-xmark mr-1"></i></button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>
