<div x-data="teachersModule()" x-init="initTeachers()" class="space-y-6">

    <!-- الهيدر وأزرار الإضافة -->
    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <h3 class="font-bold text-slate-800 text-lg">قائمة المعلمين المعتمدين</h3>
        <button @click="openAddModal()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-sm transition-all flex items-center space-x-reverse space-x-2">
            <i class="fa-solid fa-plus"></i>
            <span>إضافة معلم جديد</span>
        </button>
    </div>

    <!-- كروت المعلمين -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="teacher in teachers" :key="teacher.id">
            <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm flex flex-col justify-between">
                <div class="space-y-3">
                    <div class="flex items-center space-x-reverse space-x-3">
                        <div class="w-12 h-12 rounded-xl bg-slate-100 text-brand-600 font-extrabold flex items-center justify-center text-xl">
                            <span x-text="teacher.name.charAt(0)"></span>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-800 text-base" x-text="teacher.name"></h4>
                            <p class="text-xs text-brand-600 font-semibold" x-text="teacher.subject"></p>
                        </div>
                    </div>
                    <div class="text-xs text-slate-500 space-y-1 pt-2 border-t border-slate-100">
                        <p><i class="fa-solid fa-phone text-slate-400 ml-1"></i> <span x-text="teacher.phone || 'غير محدد'"></span></p>
                        <p><i class="fa-solid fa-percent text-slate-400 ml-1"></i> نسبة المعلم: <span class="font-bold text-slate-700" x-text="teacher.ratio + '%'"></span></p>
                    </div>
                </div>

                <div class="flex justify-end space-x-reverse space-x-2 mt-4 pt-3 border-t border-slate-100">
                    <button @click="deleteTeacher(teacher.id)" class="text-xs text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-lg font-bold transition-all">حذف</button>
                </div>
            </div>
        </template>
    </div>

    <!-- نافذة إضافة معلم -->
    <div x-show="showModal" x-cloak class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white max-w-md w-full rounded-3xl p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-slate-800 text-lg border-b pb-2">إضافة معلم جديد</h3>
            <form @submit.prevent="saveTeacher" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اسم المعلم</label>
                    <input type="text" x-model="formData.name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">المادة الدراسية</label>
                    <input type="text" x-model="formData.subject" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف</label>
                    <input type="text" x-model="formData.phone" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">نسبة الأكاديمية/المعلم (%)</label>
                    <input type="number" x-model="formData.ratio" min="0" max="100" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                </div>
                <div class="flex justify-end space-x-reverse space-x-3 pt-3">
                    <button type="button" @click="showModal = false" class="px-4 py-2 text-sm text-slate-600 bg-slate-100 rounded-xl font-bold">إلغاء</button>
                    <button type="submit" class="px-4 py-2 text-sm text-white bg-brand-600 rounded-xl font-bold">حفظ</button>
                </div>
            </form>
        </div>
    </div>

</div>
