<div x-data="subscriptionsModule()" x-init="initSubscriptions()" class="space-y-6">

    <!-- الهيدر وزر التحصيل -->
    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <h3 class="font-bold text-slate-800 text-lg">سجل اشتراكات الطلاب</h3>
        <button @click="openAddModal()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-sm transition-all flex items-center space-x-reverse space-x-2">
            <i class="fa-solid fa-plus"></i>
            <span>تحصيل اشتراك جديد</span>
        </button>
    </div>

    <!-- جدول الاشتراكات -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-right text-sm">
                <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                    <tr>
                        <th class="py-4 px-4">الطالب</th>
                        <th class="py-4 px-4">الشهر / الدورة</th>
                        <th class="py-4 px-4">المبلغ Paid</th>
                        <th class="py-4 px-4">تاريخ الدفع</th>
                        <th class="py-4 px-4 text-center">الحالة</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <template x-for="sub in subscriptions" :key="sub.id">
                        <tr class="hover:bg-slate-50/80 transition-all">
                            <td class="py-3 px-4 font-bold text-slate-800" x-text="getStudentName(sub.studentId)"></td>
                            <td class="py-3 px-4 text-slate-600" x-text="sub.month"></td>
                            <td class="py-3 px-4 font-mono font-bold text-emerald-600" x-text="formatCurrency(sub.amount)"></td>
                            <td class="py-3 px-4 text-slate-400 font-mono text-xs" x-text="sub.paymentDate"></td>
                            <td class="py-3 px-4 text-center">
                                <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">ساري</span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة تحصيل اشتراك -->
    <div x-show="showModal" x-cloak class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white max-w-md w-full rounded-3xl p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-slate-800 text-lg border-b pb-2">تحصيل اشتراك شهري</h3>
            <form @submit.prevent="saveSubscription" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اختر الطالب</label>
                    <select x-model="formData.studentId" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                        <option value="">حدد الطالب...</option>
                        <template x-for="st in students" :key="st.id">
                            <option :value="st.id" x-text="st.name + ' (' + st.code + ')'"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">عن شهر / فترة</label>
                    <input type="text" x-model="formData.month" placeholder="مثال: يوليو 2026" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">المبلغ المحصل (ج.م)</label>
                    <input type="number" x-model="formData.amount" min="1" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono">
                </div>
                <div class="flex justify-end space-x-reverse space-x-3 pt-3">
                    <button type="button" @click="showModal = false" class="px-4 py-2 text-sm text-slate-600 bg-slate-100 rounded-xl font-bold">إلغاء</button>
                    <button type="submit" class="px-4 py-2 text-sm text-white bg-brand-600 rounded-xl font-bold">حفظ وتحصيل</button>
                </div>
            </form>
        </div>
    </div>

</div>
