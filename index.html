<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Academy - نظام إدارة الأكاديمية الذكي</title>

    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Alpine.js (CDN) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Local CSS Files -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/theme.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">

    <!-- 🔒 1. شاشة القفل ودخول كلمة السر المتغيرة -->
    <div id="password-overlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 text-center border border-slate-100">
            <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Apex Academy</h2>
            <p class="text-slate-500 text-sm mb-6">يرجى إدخال كلمة السر الخاصة بالفترة الحالية للمتابعة</p>

            <form onsubmit="handlePasswordSubmit(event)" class="space-y-4">
                <div>
                    <input type="password" 
                           id="app-password-input" 
                           placeholder="أدخل كلمة السر" 
                           class="w-full px-5 py-3.5 text-center text-lg tracking-widest bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                           required>
                </div>

                <div id="password-error-msg" class="hidden text-red-500 text-xs font-semibold bg-red-50 py-2 rounded-xl">
                    <i class="fa-solid fa-triangle-exclamation ml-1"></i> كلمة السر غير صحيحة!
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 transition duration-200 active:scale-95">
                    دخول النظام
                </button>
            </form>
        </div>
    </div>

    <!-- 📱 2. واجهة التطبيق الرئيسية (تظهر بعد إدخال كلمة السر) -->
    <div id="app-main-content" class="hidden min-h-screen flex flex-col md:flex-row">

        <!-- القائمة الجانبية (Sidebar) -->
        <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col">
            <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">
                        A
                    </div>
                    <div>
                        <h1 class="font-bold text-white text-lg leading-tight">Apex Academy</h1>
                        <span class="text-xs text-indigo-400">الإدارة الذكية</span>
                    </div>
                </div>
            </div>

            <!-- أزرار الأقسام (Navigation Menu) -->
            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                <button onclick="loadModule('dashboard')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-chart-pie w-6"></i>
                    <span>الرئيسية</span>
                </button>

                <button onclick="loadModule('students')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-user-graduate w-6"></i>
                    <span>الطلاب</span>
                </button>

                <button onclick="loadModule('teachers')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-chalkboard-user w-6"></i>
                    <span>المعلمين</span>
                </button>

                <button onclick="loadModule('finance')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-wallet w-6"></i>
                    <span>المالية</span>
                </button>

                <button onclick="loadModule('attendance')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-clipboard-user w-6"></i>
                    <span>الحضور والغياب</span>
                </button>

                <button onclick="loadModule('subscriptions')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-id-card w-6"></i>
                    <span>الاشتراكات</span>
                </button>

                <button onclick="loadModule('cards')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-credit-card w-6"></i>
                    <span>الكروت</span>
                </button>

                <button onclick="loadModule('qr')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-qrcode w-6"></i>
                    <span>ماسح QR</span>
                </button>

                <button onclick="loadModule('settings')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-gear w-6"></i>
                    <span>الإعدادات</span>
                </button>

                <button onclick="loadModule('backup')" class="w-full flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition text-right">
                    <i class="fa-solid fa-database w-6"></i>
                    <span>النسخ الاحتياطي</span>
                </button>
            </nav>

            <div class="p-4 border-t border-slate-800">
                <button onclick="lockApp()" class="w-full flex items-center justify-center space-x-2 space-x-reverse px-4 py-2.5 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded-xl transition text-sm">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>قفل التطبيق</span>
                </button>
            </div>
        </aside>

        <!-- منطقة المحتوى الرئيسية (يتم تحميل الأقسام بداخلها) -->
        <main class="flex-1 p-4 md:p-8 overflow-y-auto">
            <div id="module-container">
                <!-- سيتم جلب محتوى الأقسام هنا بواسطة app.js -->
            </div>
        </main>
    </div>

    <!-- ⚙️ 3. برمجة كلمة السر المتغيرة وشروط الفتح -->
    <script>
        // حساب كلمة السر المتغيرة حسب المعادلة المطلوبة
        function getDynamicPassword() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1; // الأشهر من 1 إلى 12

            // إذا كان الشهر من 1 إلى 5: الناتج = 1 * السنة الحالية
            // إذا كان الشهر من 6 إلى 12: الناتج = 6 * السنة الحالية
            if (month >= 1 && month <= 5) {
                return (1 * year).toString();
            } else {
                return (6 * year).toString();
            }
        }

        // التحقق من الإدخال عند الضغط على زر الدخول
        function handlePasswordSubmit(event) {
            event.preventDefault();
            const inputField = document.getElementById('app-password-input');
            const errorMsg = document.getElementById('password-error-msg');
            const correctPass = getDynamicPassword();

            if (inputField.value.trim() === correctPass) {
                // حفظ حالة الدخول في الجلسة الحالية
                sessionStorage.setItem('apex_auth', 'true');
                unlockApp();
            } else {
                errorMsg.classList.remove('hidden');
                inputField.value = '';
                inputField.focus();
            }
        }

        // فتح التطبيق وتأكيد الصلاحية
        function unlockApp() {
            document.getElementById('password-overlay').classList.add('hidden');
            document.getElementById('app-main-content').classList.remove('hidden');
            
            // تحميل قسم Dashboard تلقائياً عند الدخول أول مرة
            if (window.loadModule) {
                window.loadModule('dashboard');
            }
        }

        // قفل التطبيق عند الضغط على زر الخروج
        function lockApp() {
            sessionStorage.removeItem('apex_auth');
            document.getElementById('password-overlay').classList.remove('hidden');
            document.getElementById('app-main-content').classList.add('hidden');
            document.getElementById('app-password-input').value = '';
        }

        // الفحص التلقائي عند فتح التطبيق
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('apex_auth') === 'true') {
                unlockApp();
            }
        });
    </script>

    <!-- 📦 4. استدعاء ملفات الجافاسكريبت الخارجية بالترتيب الصحيح -->
    <script src="./js/config.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/helpers.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
