<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام الشامل لإدارة السنتر التعليمي</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('apex', {
                years: JSON.parse(localStorage.getItem('apex_years')) || [],
                halls: JSON.parse(localStorage.getItem('apex_halls')) || [],
                groups: JSON.parse(localStorage.getItem('apex_groups')) || [],
                students: JSON.parse(localStorage.getItem('apex_students')) || [],
                attendance: JSON.parse(localStorage.getItem('apex_attendance')) || [],
                payments: JSON.parse(localStorage.getItem('apex_payments')) || [],
                teachers: JSON.parse(localStorage.getItem('apex_teachers')) || [],
                settings: JSON.parse(localStorage.getItem('apex_settings')) || { centerName: 'Apex Center', adminName: 'الإدارة العامة' },

                saveYear(data, id) {
                    if (!data.name.trim()) return;
                    if (id) {
                        let index = this.years.findIndex(y => y.id === id);
                        if (index !== -1) this.years[index] = { ...this.years[index], ...data };
                    } else {
                        this.years.push({ id: Date.now(), ...data });
                    }
                    this.syncStorage();
                },
                deleteYear(id) {
                    if (confirm('حذف السنة سيؤثر على المجموعات المرتبطة، هل أنت متأكد؟')) {
                        this.years = this.years.filter(y => y.id !== id);
                        this.syncStorage();
                    }
                },

                saveHall(data, id) {
                    if (!data.name.trim()) return;
                    if (id) {
                        let index = this.halls.findIndex(h => h.id === id);
                        if (index !== -1) this.halls[index] = { ...this.halls[index], ...data };
                    } else {
                        this.halls.push({ id: Date.now(), ...data });
                    }
                    this.syncStorage();
                },
                deleteHall(id) {
                    if (confirm('هل أنت متأكد من الحذف؟')) {
                        this.halls = this.halls.filter(h => h.id !== id);
                        this.syncStorage();
                    }
                },

                saveGroup(data, id) {
                    if (!data.name.trim() || !data.year) return;
                    if (id) {
                        let index = this.groups.findIndex(g => g.id === id);
                        if (index !== -1) this.groups[index] = { ...this.groups[index], ...data };
                    } else {
                        this.groups.push({ id: Date.now(), ...data });
                    }
                    this.syncStorage();
                },
                deleteGroup(id) {
                    if (confirm('هل أنت متأكد من الحذف؟')) {
                        this.groups = this.groups.filter(g => g.id !== id);
                        this.syncStorage();
                    }
                },

                saveTeacher(data, id) {
                    if (!data.name.trim()) return;
                    if (id) {
                        let index = this.teachers.findIndex(t => t.id === id);
                        if (index !== -1) this.teachers[index] = { ...this.teachers[index], ...data };
                    } else {
                        this.teachers.push({ id: Date.now(), ...data });
                    }
                    this.syncStorage();
                },
                deleteTeacher(id) {
                    if (confirm('هل أنت متأكد من حذف المعلم؟')) {
                        this.teachers = this.teachers.filter(t => t.id !== id);
                        this.syncStorage();
                    }
                },

                saveStudent(data, id) {
                    if (!data.name || !data.year || !data.group) return;
                    let targetGroup = this.groups.find(g => g.name === data.group && g.year === data.year);
                    let groupPrice = targetGroup ? targetGroup.price : 0;

                    if (id) {
                        let index = this.students.findIndex(s => s.id === id);
                        if (index !== -1) {
                            this.students[index] = { 
                                ...this.students[index], 
                                ...data, 
                                requiredAmount: groupPrice 
                            };
                        }
                    } else {
                        const newStudent = { 
                            id: Date.now(), 
                            code: 'ST-' + Math.floor(1000 + Math.random() * 9000), 
                            regDate: new Date().toLocaleDateString('ar-EG'),
                            requiredAmount: groupPrice,
                            ...data 
                        };
                        this.students.push(newStudent);
                        this.syncStorage();
                        return newStudent;
                    }
                    this.syncStorage();
                },
                deleteStudent(id) {
                    if (confirm('هل أنت متأكد من حذف الطالب؟')) {
                        this.students = this.students.filter(s => s.id !== id);
                        this.syncStorage();
                    }
                },

                recordAttendanceByCode(code) {
                    let student = this.students.find(s => s.code === code || s.name.trim() === code.trim());
                    if (!student) return { success: false, message: 'الطالب غير مسجل بالسيستم!' };

                    let totalPaid = this.payments.filter(p => p.code === student.code).reduce((sum, p) => sum + Number(p.amount), 0);
                    let remaining = Number(student.requiredAmount) - totalPaid;

                    const record = {
                        id: Date.now(),
                        code: student.code,
                        name: student.name,
                        group: student.group,
                        date: new Date().toLocaleDateString('ar-EG'),
                        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
                    };
                    this.attendance.unshift(record);
                    this.syncStorage();

                    return { 
                        success: true, 
                        student: student, 
                        totalPaid: totalPaid, 
                        remaining: remaining 
                    };
                },

                savePayment(paymentData) {
                    this.payments.unshift({ id: Date.now(), date: new Date().toLocaleString('ar-EG'), ...paymentData });
                    this.syncStorage();
                },

                saveSettings(settings) {
                    this.settings = settings;
                    this.syncStorage();
                },

                syncStorage() {
                    localStorage.setItem('apex_years', JSON.stringify(this.years));
                    localStorage.setItem('apex_halls', JSON.stringify(this.halls));
                    localStorage.setItem('apex_groups', JSON.stringify(this.groups));
                    localStorage.setItem('apex_students', JSON.stringify(this.students));
                    localStorage.setItem('apex_attendance', JSON.stringify(this.attendance));
                    localStorage.setItem('apex_payments', JSON.stringify(this.payments));
                    localStorage.setItem('apex_teachers', JSON.stringify(this.teachers));
                    localStorage.setItem('apex_settings', JSON.stringify(this.settings));
                }
            });
        });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
    <!-- إطار العمل الرئيسي -->
</body>
</html>
