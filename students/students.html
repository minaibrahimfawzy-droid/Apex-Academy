<div x-data="studentsModule()" x-init="initStudents()" class="space-y-6">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="w-full md:w-96 relative">
            <input type="text" x-model="searchQuery" placeholder="ابحث باسم الطالب أو رقم الهاتف أو الكود..." class="w-full pr-10 pl-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50">
            <i class="fa-solid fa-search absolute right-3.5 top-3.5 text-slate-400 text-xs"></i>
        </div>
        <button @click="openAddModal()" class="w-full md:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-reverse space-x-2">
            <i class="fa-solid fa-plus"></i>
            <span>إضافة طالب جديد</span>
        </button>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-right text-sm">
                <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                    <tr>
                        <th class="py-4 px-4">الكود</th>
                        <th class="py-4 px-4">اسم الطالب</th>
                        <th class="py-4 px-4">الصف الدراسي</th>
                        <th class="py-4 px-4">هاتف الطالب</th>
                        <th class="py-4 px-4">هاتف ولي الأمر</th>
                        <th class="py-4 px-4 text-center">الإجراءات</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <template x-for="student in filteredStudents" :key="student.id">
                        <tr class="hover:bg-slate-50/80 transition-all">
                            <td class="py-3 px-4 font-mono font-bold text-indigo-600" x-text="student.code"></td>
                            <td class="py-3 px-4 font-bold text-slate-800" x-text="student.name"></td>
                            <td class="py-3 px-4 text-slate-600" x-text="student.grade"></td>
                            <td class="py-3 px-4 font-mono text-slate-600" x-text="student.phone || '-'"></td>
                            <td class="py-3 px-4 font-mono text-slate-600" x-text="student.parentPhone || '-'"></td>
                            <td class="py-3 px-4">
                                <div class="flex items-center justify-center space-x-reverse space-x-2">
                                    <button @click="editStudent(student)" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all" title="تعديل"><i class="fa-solid fa-pen"></i></button>
                                    <button @click="deleteStudent(student.id)" class="p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="حذف"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <template x-if="filteredStudents.length === 0">
                        <tr><td colspan="6" class="py-8 text-center text-slate-400">لا يوجد طلاب مطابقون للبحث</td></tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة الإضافة والتعديل Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white max-w-lg w-full rounded-3xl p-6 shadow-2xl border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-800 text-lg" x-text="isEdit ? 'تعديل بيانات طالب' : 'إضافة طالب جديد'"></h3>
                <button @click="showModal = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form @submit.prevent="saveStudent" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اسم الطالب رباعي</label>
                    <input type="text" x-model="formData.name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">الصف الدراسي</label>
                    <select x-model="formData.grade" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="">اختر الصف الدراسي...</option>
                        <option value="الأول الثانوي">الأول الثانوي</option>
                        <option value="الثاني الثانوي">الثاني الثانوي</option>
                        <option value="الثالث الثانوي">الثالث الثانوي</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">رقم هاتف الطالب</label>
                        <input type="text" x-model="formData.phone" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">رقم هاتف ولي الأمر</label>
                        <input type="text" x-model="formData.parentPhone" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>
                <div class="flex justify-end space-x-reverse space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" @click="showModal = false" class="px-5 py-2.5 rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 text-sm font-bold">إلغاء</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 text-sm font-bold shadow-md shadow-indigo-600/20">حفظ البيانات</button>
                </div>
            </form>
        </div>
    </div>
</div>
